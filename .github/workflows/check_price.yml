name: Revisar precios de acciones
 
on:
  schedule:
    # Se ejecuta cada 5 minutos. Ajusta el número si quieres más o menos frecuencia.
    - cron: "*/5 * * * *"
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña Actions
 
jobs:
  revisar-precios:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Instalar dependencias
        run: pip install requests yfinance
      
      - name: Ejecutar el bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_stock_alert_github.py
 
      - name: Guardar cambios en config.json (si hubo alertas disparadas)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --staged --quiet || git commit -m "Actualizar estado de alertas"
          git push
 
